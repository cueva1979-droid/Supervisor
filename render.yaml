databases:
  - name: supervisor-db
    plan: free

services:
  - type: web
    name: supervisor
    runtime: python
    plan: free
    buildCommand: |
      cd frontend
      npm install
      npm run build
      cd ..
      pip install -r backend/requirements.txt
    startCommand: python run.py
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: supervisor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
