services:
  - type: web
    name: supervisor
    runtime: python@3.12
    plan: free
    buildCommand: |
      cd frontend && npm install && npm run build
      cd .. && pip install -r backend/requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
